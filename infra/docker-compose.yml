services:
  postgres:
    image: postgres:16-alpine
    container_name: genericbt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genericbt}
      POSTGRES_USER: ${POSTGRES_USER:-genericbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genericbt}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genericbt} -d ${POSTGRES_DB:-genericbt}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:
