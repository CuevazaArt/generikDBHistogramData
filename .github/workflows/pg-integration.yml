name: pg-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pg-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PG_DSN: postgresql+psycopg://genericbt:genericbt@127.0.0.1:5432/genericbt

jobs:
  pg-tests:
    name: pg-tests (ubuntu, py3.11, postgres:16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: genericbt
          POSTGRES_USER: genericbt
          POSTGRES_PASSWORD: genericbt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genericbt -d genericbt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply PG migrations (if pg_init.py is present)
        if: hashFiles('scripts/pg_init.py') != ''
        env:
          PYTHONPATH: .
        run: python scripts/pg_init.py --dsn "$PG_DSN"

      - name: Run PG-marked tests (skip cleanly if none collected)
        env:
          PYTHONPATH: .
        run: |
          set -e
          if python -m pytest tests/ --collect-only -q -m pg 2>/dev/null | grep -q "test"; then
            python -m pytest tests/ -m "pg" -q --no-header --maxfail=10
          else
            echo "no pg tests yet, skipping"
          fi
