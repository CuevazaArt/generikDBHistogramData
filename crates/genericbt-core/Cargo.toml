[package]
name = "genericbt-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "genericbt_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
